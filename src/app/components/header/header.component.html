<a class="skip-link" href="#main-content">{{
  t("Saltar al contenido", "Skip to content")
}}</a>
<header class="site-header">
  <a class="wordmark" routerLink="/" aria-label="K189 — Camilo Arias"
    >K189<span class="logo-dot"></span
  ></a>
  <nav
    id="primary-navigation"
    [attr.aria-label]="t('Navegación principal', 'Main navigation')"
  >
    <a routerLink="/projects" routerLinkActive="active">{{
      t("Proyectos", "Work")
    }}</a
    ><a routerLink="/about" routerLinkActive="active">{{
      t("Sobre mí", "About")
    }}</a
    ><a routerLink="/contact" routerLinkActive="active" class="contact-link"
      >{{ t("Contacto", "Contact") }}
      <span aria-hidden="true"><app-icon name="up-right" /></span
    ></a>
  </nav>
  <div
    class="language-switch"
    role="group"
    [attr.aria-label]="t('Idioma', 'Language')"
  >
    <button
      (click)="locale.set('es')"
      [class.selected]="locale.language() === 'es'"
      [attr.aria-pressed]="locale.language() === 'es'"
      lang="es"
      aria-label="Español"
    >
      ES</button
    ><span>/</span
    ><button
      (click)="locale.set('en')"
      [class.selected]="locale.language() === 'en'"
      [attr.aria-pressed]="locale.language() === 'en'"
      lang="en"
      aria-label="English"
    >
      EN
    </button>
  </div>
</header>
