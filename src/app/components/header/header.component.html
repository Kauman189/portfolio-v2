<a class="skip-link" href="#main-content">{{
  t("Saltar al contenido", "Skip to content")
}}</a>
<header class="site-header" (keydown.escape)="menuOpen = false">
  <a class="wordmark" routerLink="/" aria-label="K189 — Camilo Arias"
    >K189<span class="logo-dot"></span></a
  ><span class="header-description"
    >{{ t("Diseñador UX/UI y visual", "UX/UI & visual designer") }}<br />{{
      t("Valencia, España", "Valencia, Spain")
    }}</span
  ><button
    class="menu-toggle"
    (click)="menuOpen = !menuOpen"
    [attr.aria-expanded]="menuOpen"
    aria-controls="primary-navigation"
  >
    {{ menuOpen ? t("Cerrar −", "Close −") : t("Menú +", "Menu +") }}
  </button>
  <nav
    id="primary-navigation"
    [attr.aria-label]="t('Navegación principal', 'Main navigation')"
    [class.is-open]="menuOpen"
  >
    <a routerLink="/projects" routerLinkActive="active"
      ><span>01</span> {{ t("Proyectos", "Work") }}</a
    ><a routerLink="/about" routerLinkActive="active"
      ><span>02</span> {{ t("Sobre mí", "About") }}</a
    ><a routerLink="/imagine" routerLinkActive="active"
      ><span>03</span> Imagine</a
    ><a routerLink="/contact" routerLinkActive="active" class="contact-link"
      >{{ t("Hablemos", "Let’s talk") }} <span aria-hidden="true">↗</span></a
    >
  </nav>
  <div
    class="language-switch"
    role="group"
    [attr.aria-label]="t('Idioma', 'Language')"
  >
    <button
      (click)="locale.set('es')"
      [class.selected]="locale.language() === 'es'"
      [attr.aria-pressed]="locale.language() === 'es'"
      lang="es"
      aria-label="Español"
    >
      ES</button
    ><span>/</span
    ><button
      (click)="locale.set('en')"
      [class.selected]="locale.language() === 'en'"
      [attr.aria-pressed]="locale.language() === 'en'"
      lang="en"
      aria-label="English"
    >
      EN
    </button>
  </div>
</header>
