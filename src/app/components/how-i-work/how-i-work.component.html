<section class="process-simple" aria-labelledby="process-title">
  <div class="process-heading">
    <span class="eyebrow">{{ t("Mi enfoque", "My approach") }}</span>
    <h2 id="process-title">{{ t("Lo que aporto.", "What I bring.") }}</h2>
  </div>
  <div class="process-list">
    @for (strength of strengths; track strength.title) {
      <section class="process-step">
        <h3>{{ strength.title }}</h3>
        <p>{{ strength.body }}</p>
      </section>
    }
  </div>
</section>
