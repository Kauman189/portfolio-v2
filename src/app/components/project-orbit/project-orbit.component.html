<section
  class="orbit"
  [attr.aria-label]="
    t(
      'Proyectos seleccionados, galería circular',
      'Selected projects, circular gallery'
    )
  "
  aria-roledescription="carousel"
  tabindex="0"
  (keydown)="onKey($event)"
  (focusin)="paused = true"
  (focusout)="onFocusOut($event)"
>
  <div
    class="orbit-stage"
    [class.is-dragging]="dragging"
    (pointerdown)="startDrag($event)"
    (dragstart)="$event.preventDefault()"
  >
    <div class="orbit-guide" aria-hidden="true"></div>
    <div class="orbit-center" aria-hidden="true">
      <app-living-mark class="center-mark" variant="frog" />
    </div>
    @for (project of projects; track project.slug; let i = $index) {
      <a
        #orbitCard
        class="orbit-card"
        [class.selected]="i === activeIndex"
        [href]="'/projects/' + project.slug"
        (click)="openProject($event, project.slug)"
        [attr.aria-label]="
          t('Ver ', 'View ') + t(project.titleEs, project.title)
        "
      >
        <div class="orbit-art" [style.background]="project.color">
          <img
            [src]="project.thumbnail"
            [alt]="t(project.titleEs, project.title)"
            draggable="false"
            [style.object-fit]="project.imageFit"
            width="240"
            height="170"
            [attr.fetchpriority]="i === 0 ? 'high' : 'auto'"
          />
        </div>
        <div class="orbit-caption">
          <span>{{ t(project.shortTitleEs, project.shortTitle) }}</span
          ><span aria-hidden="true"><app-icon name="up-right" /></span>
        </div>
      </a>
    }
  </div>
</section>
