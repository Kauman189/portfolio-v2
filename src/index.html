    <div id="cookie-banner" class="cookie-banner">
      <span

      >
      <div>
        <button onclick="acceptCookies()" class="cookie-btn cookie-btn-accept">
          Aceptar
        </button>
        <button onclick="rejectCookies()" class="cookie-btn cookie-btn-reject">
          Rechazar
        </button>
      </div>
    </div>

    <script>
      function acceptCookies() {
        localStorage.setItem("cookies-accepted", "true");
        document.getElementById("cookie-banner").style.display = "none";
        loadAnalytics();
      }

      function rejectCookies() {
        localStorage.setItem("cookies-accepted", "false");
        document.getElementById("cookie-banner").style.display = "none";
      }

      function loadAnalytics() {
        let script = document.createElement("script");
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-9CRXZQMWBK";
        script.async = true;
        document.head.appendChild(script);

        script.onload = function () {
          window.dataLayer = window.dataLayer || [];
          function gtag() {
            dataLayer.push(arguments);
          }
          gtag("js", new Date());
          gtag("config", "G-9CRXZQMWBK");
        };
      }

      if (localStorage.getItem("cookies-accepted") === "true") {
        loadAnalytics();
        document.getElementById("cookie-banner").style.display = "none";
      } else if (localStorage.getItem("cookies-accepted") === "false") {
        document.getElementById("cookie-banner").style.display = "none";
      }
    </script>
